<!DOCTYPE html>
<html>
<head>
    <script src="./static/js/access-control.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Tower of Babel: Systematically Analyzing Account Management Vulnerabilities in Web OAuth Integration - Workflow Visualization">
    <title>Hybrid Account Management Workflow</title>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --sidebar-width: 600px; /* Fixed width on the right - slightly wider to accommodate table */
            --primary-text: #1e293b;
            --line-color: #475569;
            --box-fill: #ffffff;
            --box-stroke: #334155;
            --pink-fill: #ffe4e6;
            --pink-stroke: #f43f5e;
            --pink-hover: #fda4af;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent overall page scrollbar */
        }

        /* Top Navigation */
        header {
            height: 80px; /* Increased height */
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            padding: 0 32px; /* Increased padding */
            flex-shrink: 0; /* Prevent header from being compressed */
            z-index: 50;
        }
        header h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
        .badge { 
            background: #dbeafe; 
            color: #1e40af; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 14px; /* Increased font size */
            margin-left: 16px; 
            font-weight: 700; 
        }

        /* Main Container: Left-Right Layout */
        .main-container {
            display: flex;
            flex: 1; /* Take up remaining height */
            height: calc(100vh - 80px); /* Subtract new header height */
            overflow: hidden;
            position: relative; /* Add relative positioning as reference for absolutely positioned child elements */
        }

        /* Left Canvas Area: Adaptive Scaling */
        .canvas-pane {
            flex: 1; /* Automatically fill remaining space */
            background-color: #ffffff; /* Pure white canvas consistent with reference image */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* SVG adaptive, no scrollbar needed */
            padding: 20px;
            position: relative;
            user-select: none;
        }

        .svg-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1800px;
            max-height: 1350px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        /* SVG Settings */
        svg {
            width: 100%;
            height: 100%;
            /* Shadow and rounded corners */
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.05));
        }

        /* Right Sidebar: Floating Card Style */
        .sidebar-pane {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            margin: 16px; 
            height: auto; /* Height adapts to content */
            max-height: calc(100% - 32px); /* Maximum height limit to prevent overflow */
            align-self: center; /* Vertically centered */
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.03);
            z-index: 40;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Collapse sidebar directly when empty */
        .sidebar-pane.is-collapsed {
            width: 0;
            margin: 16px 0; /* Keep vertical margin consistent, horizontal is 0 */
            padding: 0;
            border-width: 0;
            opacity: 0;
            box-shadow: none;
            overflow: hidden;
        }

        .sidebar-content {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            display: none; /* Hidden by default */
        }

        .group-rect { fill: none; stroke: var(--box-stroke); stroke-width: 2; rx: 12; }
        .group-label { font-size: 14px; font-weight: 700; fill: var(--primary-text); }

        .node-rect { fill: var(--box-fill); stroke: var(--line-color); stroke-width: 1.5; rx: 6; }
        .node-text { font-size: 11px; fill: var(--primary-text); font-weight: 600; text-anchor: middle; dominant-baseline: middle; }

        .diamond-shape { fill: var(--box-fill); stroke: var(--line-color); stroke-width: 1.5; }
        .diamond-text { font-size: 11px; fill: var(--primary-text); text-anchor: middle; dominant-baseline: middle; font-weight: 600; }

        .step-group { cursor: pointer; }
        .step-rect {
            fill: var(--pink-fill); stroke: var(--pink-stroke); stroke-width: 2; rx: 6;
            transition: all 0.2s ease;
        }
        .step-group:hover .step-rect {
            fill: var(--pink-hover); stroke-width: 2.5;
            filter: drop-shadow(0 4px 8px rgba(244, 63, 94, 0.4));
        }
        .step-num { font-size: 10px; font-weight: 800; fill: #be123c; }

        .link { fill: none; stroke: var(--line-color); stroke-width: 1.5; stroke-linejoin: round; }
        .link-dashed { stroke-dasharray: 6, 4; }
        
        .icon-success { fill: white; stroke: #10b981; stroke-width: 2; }
        .icon-error { fill: white; stroke: #ef4444; stroke-width: 2; }
        .detail-tag {
            display: inline-flex;
            align-items: center;
            background: #ffe4e6;
            color: #be123c;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 24px;
            border: 1px solid #fda4af;
            white-space: nowrap;
        }

        h2 { 
            margin: 0 0 16px 0; 
            font-size: 32px; 
            font-weight: 800;
            color: #0f172a; 
            line-height: 1.1;
        }

        p { 
            font-size: 16px; 
            line-height: 1.6; 
            color: #475569; 
            margin-bottom: 32px; 
        }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #0f172a;
            margin: 24px 0 12px 0;
        }

        /* Cases Table Styling */
        .cases-wrapper {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            overflow: hidden; /* For rounded corners */
            background: white;
        }
        .cases-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: #334155;
        }
        .cases-table th {
            background: #f1f5f9;
            color: #475569;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            padding: 8px 12px; /* More compact */
            text-align: left;
            border-bottom: 1px solid #cbd5e1;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .cases-table td {
            padding: 8px 12px; /* More compact */
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
            line-height: 1.5;
        }
        .cases-table tr:last-child td {
            border-bottom: none;
        }
        .cases-table tr:hover {
            background: #f8fafc;
        }
        .col-id {
            color: #be123c;
            font-weight: 700;
            width: 40px;
            text-align: center;
        }
        .col-site {
            font-weight: 600;
            color: #0f172a;
        }

        ul {
            margin: 0 0 16px 18px;
            padding: 0;
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
        }
        
        li {
            margin-bottom: 8px;
        }
        
        pre {
            background: #1e293b; padding: 15px; border-radius: 8px;
            font-size: 12px; color: #e2e8f0; overflow-x: auto;
            border: 1px solid #334155;
        }
        
        /* Empty State Hint Card: Floating on canvas (top-right hint) */
        .empty-overlay {
            position: absolute;
            top: 24px;
            right: 24px;
            width: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            color: #94a3b8;
            text-align: center;
            pointer-events: none; /* Don't block SVG clicks */
            z-index: 20;
        }
        .empty-overlay .empty-card {
            width: 100%;
            max-width: 360px;
            padding: 22px 18px;
            border-radius: 14px;
            border: 1px solid #cbd5e1; /* Dashed line -> Solid line */
            background: #ffffff;      /* Solid white interior */
            pointer-events: none;
        }
        .empty-overlay i { font-size: 40px; margin-bottom: 14px; color: #cbd5e1; }
        .empty-overlay p { margin: 0; }

        /* Animation */
        .slide-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Zoom Controls, only applies to flowchart */
        .zoom-controls {
            position: absolute;
            left: 24px;
            bottom: 24px;
            background: rgba(255,255,255,0.95);
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 24px rgba(15,23,42,0.06);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .zoom-controls button {
            width: 32px;
            height: 32px;
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #0f172a;
        }
        .zoom-controls input[type="range"] {
            width: 120px;
            accent-color: #f43f5e;
        }
        .zoom-value {
            min-width: 48px;
            text-align: right;
            font-size: 12px;
            color: #475569;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Tower of Babel: Hybrid Account Management Workflow</h1>
        <span class="badge">Standard State Transitions</span>
    </header>

    <div class="main-container">
        <!-- Left: Adaptive SVG Canvas -->
        <div class="canvas-pane">
            <div class="zoom-controls">
                <button id="zoom-out" aria-label="Zoom out">-</button>
                <input id="zoom-range" type="range" min="0.7" max="2.0" step="0.05" value="1">
                <button id="zoom-in" aria-label="Zoom in">+</button>
                <span class="zoom-value" id="zoom-value">100%</span>
            </div>
            <div class="svg-wrapper" id="svg-wrapper">
            <svg viewBox="0 0 2100 1400" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
                    </marker>
                </defs>

                <!-- ==============================================
                     1. First Party Registration (Left Top)
                     ============================================== -->
                <g transform="translate(80, 70)">
                    <rect x="0" y="0" width="1050" height="320" class="group-rect" />
                    <text x="25" y="35" class="group-label">First Party Registration</text>

                    <!-- Input ID -->
                    <g transform="translate(25, 110)">
                        <rect width="80" height="40" class="node-rect"/>
                        <text x="40" y="23" class="node-text">Input ID</text>
                    </g>
                    <path d="M105 130 L180 130" class="link" marker-end="url(#arrow)"/>

                    <!-- Step 1: Verify ID -->
                    <g class="step-group" onclick="showDetail('step1')" transform="translate(180, 110)">
                        <rect width="90" height="40" class="step-rect"/>
                        <text x="12" y="16" class="step-num">1</text>
                        <text x="47" y="25" class="node-text">Verify ID</text>
                    </g>

                    <!-- Split Path -->
                    <path d="M270 130 L300 130" class="link"/>
                    <path d="M300 130 L300 80 L340 80" class="link" marker-end="url(#arrow)"/> <!-- Up -->
                    <path d="M300 130 L300 180 L340 180" class="link" marker-end="url(#arrow)"/> <!-- Down -->

                    <!-- Phone Path (Up) -->
                    <g transform="translate(340, 60)">
                        <rect width="110" height="40" class="node-rect"/>
                        <text x="55" y="23" class="node-text">Phone number</text>
                    </g>
                    <path d="M450 80 L490 80" class="link" marker-end="url(#arrow)"/>
                    <g transform="translate(490, 60)">
                        <rect width="90" height="40" class="node-rect"/>
                        <text x="45" y="23" class="node-text">SMS OTP</text>
                    </g>
                    <!-- Phone Merge -->
                    <path d="M580 80 L630 80 L630 120" class="link"/>

                    <!-- Email Path (Down) -->
                    <g transform="translate(340, 160)">
                        <rect width="110" height="40" class="node-rect"/>
                        <text x="55" y="23" class="node-text">Email Address</text>
                    </g>
                    <path d="M450 175 L490 175" class="link" marker-end="url(#arrow)"/>
                    <path d="M450 185 L470 185 L470 215 L490 215" class="link" marker-end="url(#arrow)"/>
                    
                    <!-- Stacked OTP/Link -->
                    <g transform="translate(490, 160)">
                        <rect width="90" height="30" class="node-rect"/>
                        <text x="45" y="17" class="node-text">OTP</text>
                    </g>
                    <g transform="translate(490, 200)">
                        <rect width="90" height="30" class="node-rect"/>
                        <text x="45" y="17" class="node-text">Confirmation</text>
                    </g>
                    <!-- Email Merge -->
                    <path d="M580 175 L630 175 L630 140" class="link"/>
                    <path d="M580 215 L630 215 L630 140" class="link"/>

                    <!-- Merge to Step 2 -->
                    <path d="M630 120 L630 140 L690 140" class="link" marker-end="url(#arrow)"/>
                    <path d="M630 140 L690 140" class="link" marker-end="url(#arrow)"/>

                    <!-- Step 2 -->
                    <g class="step-group" onclick="showDetail('step2')" transform="translate(690, 120)">
                        <rect width="130" height="40" class="step-rect"/>
                        <text x="12" y="16" class="step-num">2</text>
                        <text x="67" y="25" class="node-text">Session Binding</text>
                    </g>
                    <path d="M820 140 L870 140" class="link" marker-end="url(#arrow)"/>

                    <!-- Step 3 (Outside box slightly but logically connected) -->
                    <g class="step-group" onclick="showDetail('step3')" transform="translate(870, 140)">
                        <!-- Diamond center is (40, 0) relative to g -->
                        <polygon points="40,-25 80,0 40,25 0,0" class="step-rect"/>
                        <text x="40" y="2" class="node-text">Success?</text>
                        <text x="35" y="-6" class="step-num">3</text>
                    </g>

                    <!-- Success (Y) to 1st Party Account - straight line (no arrowhead into 1st-party box) -->
                    <path d="M950 140 L1190 140" class="link"/>
                    <circle cx="1075" cy="140" r="8" class="icon-success"/>
                    <text x="1075" y="144" text-anchor="middle" fill="#10b981" font-weight="bold" font-size="12">✓</text>

                    <!-- Feedback Loop (N - Failure) -->
                    <path d="M910 165 L910 250 L220 250 L220 155" class="link link-dashed" marker-end="url(#arrow)"/>
                    <circle cx="570" cy="250" r="8" fill="white" stroke="#ef4444" stroke-width="2"/>
                    <text x="570" y="254" text-anchor="middle" fill="#ef4444" font-weight="bold" font-size="12">×</text>
                </g>

                <!-- ==============================================
                     2. Third Party Registration (Left Middle)
                     ============================================== -->
                <g transform="translate(80, 430)">
                    <!-- Slightly narrowed while keeping the right-side diamonds inside -->
                    <rect x="0" y="0" width="1200" height="270" class="group-rect" />
                    <text x="25" y="35" class="group-label">Third Party Registration</text>

                    <g transform="translate(25, 90)">
                        <rect width="80" height="40" class="node-rect"/>
                        <text x="40" y="23" class="node-text">Select IdP</text>
                    </g>
                    <path d="M105 110 L180 110" class="link" marker-end="url(#arrow)"/>

                    <g transform="translate(180, 90)">
                        <rect width="80" height="40" class="node-rect"/>
                        <text x="40" y="23" class="node-text">Login</text>
                    </g>
                    <path d="M260 110 L310 110" class="link" marker-end="url(#arrow)"/>

                    <g transform="translate(310, 90)">
                        <rect width="110" height="40" class="node-rect"/>
                        <text x="55" y="23" class="node-text">Authorization</text>
                    </g>
                    
                    <!-- Fork -->
                    <path d="M420 110 L440 110" class="link"/>
                    <path d="M440 110 L440 70 L480 70" class="link" marker-end="url(#arrow)"/> <!-- Up -->
                    <path d="M440 110 L440 170 L480 170" class="link" marker-end="url(#arrow)"/> <!-- Down -->

                    <!-- Provided -->
                    <g transform="translate(480, 50)">
                        <rect width="140" height="40" class="node-rect"/>
                        <text x="70" y="23" class="node-text">Identifier Provided</text>
                    </g>
                    <!-- Solid line to 3rd Party Account (no arrowhead into 3rd-party box) -->
                    <path d="M620 70 L1330 70 L1330 200" class="link"/>
                    <circle cx="1000" cy="70" r="8" class="icon-success"/>
                    <text x="1000" y="74" text-anchor="middle" fill="#10b981" font-weight="bold" font-size="12">✓</text>

                    <!-- Missing -->
                    <g transform="translate(480, 150)">
                        <rect width="140" height="40" class="node-rect"/>
                        <text x="70" y="23" class="node-text">Identifier Missing</text>
                    </g>
                    <path d="M620 170 L670 170" class="link" marker-end="url(#arrow)"/>

                    <g transform="translate(670, 150)">
                        <rect width="120" height="40" class="node-rect"/>
                        <text x="60" y="23" class="node-text">Bind Identifier</text>
                    </g>
                    <path d="M790 170 L835 170" class="link" marker-end="url(#arrow)"/>

                    <!-- Associated? -->
                    <g transform="translate(905, 170)">
                        <polygon points="70,0 140,34 70,68 0,34" class="diamond-shape" transform="translate(-70, -34)"/>
                        <text x="0" y="-7" class="diamond-text" text-anchor="middle">Associated with</text>
                        <text x="0" y="7" class="diamond-text" text-anchor="middle">Existing Account?</text>
                    </g>
                    <!-- N: To 3rd Party Account (no arrowhead into 3rd-party box) -->
                    <path d="M905 204 L905 225 L1290 225" class="link link-dashed"/>
                    <!-- Place the X on the longest dashed segment (center of the long horizontal run) -->
                    <circle cx="1088" cy="225" r="8" fill="white" stroke="#ef4444" stroke-width="2"/>
                    <text x="1088" y="229" text-anchor="middle" fill="#ef4444" font-weight="bold" font-size="12">×</text>
                    
                    <!-- Right: To IdP Binding Exists -->
                    <path d="M975 170 L1025 170" class="link" marker-end="url(#arrow)"/>
                    
                    <!-- Binding Exists? -->
                    <g transform="translate(1095, 170)">
                         <polygon points="70,0 140,34 70,68 0,34" class="diamond-shape" transform="translate(-70, -34)"/>
                        <text x="0" y="-7" class="diamond-text" text-anchor="middle">IdP Binding</text>
                        <text x="0" y="7" class="diamond-text" text-anchor="middle">Exists?</text>
                    </g>
                    
                    <!-- Y: Loop back to Bind Identifier (from IdP Binding Exists) -->
                    <path d="M1095 136 L1095 120 L750 120 L750 150" class="link" marker-end="url(#arrow)"/>
                    <circle cx="900" cy="120" r="8" class="icon-success"/>
                    <text x="900" y="124" text-anchor="middle" fill="#10b981" font-weight="bold" font-size="12">✓</text>
                    
                     <!-- Output to 1st Party Account - Dashed line (no arrow, blue path) -->
                    <!-- Output to 1st Party Account - Dashed line (shifted slightly right) -->
                    <path d="M1165 170 L1230 170 L1230 -40 L1230 -190" class="link link-dashed"/>
                    <!-- Place the X on the dashed line (midpoint of the top horizontal segment) -->
                    <circle cx="1198" cy="170" r="8" fill="white" stroke="#ef4444" stroke-width="2"/>
                    <text x="1198" y="174" text-anchor="middle" fill="#ef4444" font-weight="bold" font-size="12">×</text>
                </g>

                <!-- 1st Party Account Indicator (Outside all boxes) -->
                <g transform="translate(1270, 185)">
                    <rect width="80" height="50" class="node-rect" style="stroke-dasharray:4,2"/>
                    <text x="40" y="33" class="node-text" text-anchor="middle">1st-Party Acc.</text>
                </g>

                <!-- 3rd Party User Node (Outside all boxes) -->
                <g transform="translate(1370, 630)">
                    <rect width="80" height="50" class="node-rect" style="stroke-dasharray:4,2"/>
                    <text x="40" y="33" class="node-text" text-anchor="middle">3rd-Party Acc.</text>
                </g>
                
                <!-- From 1st Party to merge point -->
                <path d="M1350 210 L1480 210 L1480 380" class="link"/>
                
                <!-- From 3rd Party to merge point -->
                <path d="M1450 655 L1480 655 L1480 380" class="link"/>
                
                <!-- Merged line to Account Co-exist -->
                <path d="M1480 380 L1555 380" class="link" marker-end="url(#arrow)"/>

                <!-- ==============================================
                     3. Account Linking (Right Side)
                     ============================================== -->
                <g id="linking" transform="translate(1520, 220)">
                    <!-- Keep the container style consistent with other groups -->
                    <rect x="0" y="0" width="380" height="460" class="group-rect" />
                    <text x="20" y="30" class="group-label">Account Linking</text>

                    <!-- Step 4: Co-exist? (Big Diamond) -->
                    <g class="step-group" onclick="showDetail('step4')" transform="translate(95, 160)">
                        <polygon points="60,0 120,50 60,100 0,50" class="step-rect" transform="translate(-60, -50)"/>
                        <text x="0" y="-8" class="node-text" style="font-weight:700; text-anchor:middle">Account</text>
                        <text x="0" y="6" class="node-text" style="font-weight:700; text-anchor:middle">Co-exist?</text>
                        <!-- step number should be inside the diamond -->
                        <text x="-32" y="-16" class="step-num">4</text>
                    </g>

                    <!-- Y (From top corner to top corner with bends) -->
                    <path d="M95 110 L95 45 L300 45 L300 75" class="link" marker-end="url(#arrow)"/>
                    <circle cx="200" cy="47" r="8" class="icon-success"/>
                    <text x="200" y="51" text-anchor="middle" fill="#10b981" font-weight="bold" font-size="12">✓</text>

                    <!-- N (Down to Standalone) -->
                    <path d="M95 210 L95 382" class="link link-dashed" marker-end="url(#arrow)"/>
                    <circle cx="95" cy="296" r="8" fill="white" stroke="#ef4444" stroke-width="2"/>
                    <text x="95" y="300" text-anchor="middle" fill="#ef4444" font-weight="bold" font-size="12">×</text>

                    <!-- Matches? -->
                    <g transform="translate(300, 100)">
                        <polygon points="50,0 100,25 50,50 0,25" class="diamond-shape" transform="translate(-50, -25)"/>
                        <text x="0" y="1" class="diamond-text" text-anchor="middle">ID Matches?</text>
                    </g>
                    <!-- Y (Down) -->
                    <path d="M300 125 L300 185" class="link" marker-end="url(#arrow)"/>
                    <circle cx="300" cy="150" r="8" class="icon-success"/>
                    <text x="300" y="154" text-anchor="middle" fill="#10b981" font-weight="bold" font-size="12">✓</text>
                    
                    <!-- Link? -->

                    desc: "The system's frontend UI fails to display all linked third-party accounts completely and clearly, preventing users from detecting anomalous bindings.",
                    cases: [
                        { site: "A visual discovery engine", issue: "Only shows if Google login is supported." },
                        { site: "A video streaming service", issue: "Shows linked IdP info, unable to bind or unbind." },
                        { site: "An internet service company", issue: "No management interface." },
                        { site: "A video sharing website", issue: "Only shows linked IdP info." },
                        { site: "A video conferencing platform", issue: "Shows linked IdP info, unable to bind or unbind." },
                        { site: "A web performance and security company", issue: "No management interface." },
                        { site: "A URL shortening service", issue: "No management interface, only supports Google." },
                        { site: "A web services provider", issue: "No management interface, only supports Google." },
                        { site: "A video hosting platform", issue: "No management interface." },
                        { site: "A non-profit software organization", issue: "No management interface." },
                        { site: "A social news aggregation website", issue: "No management interface." },
                        { site: "A game development engine", issue: "No management interface." },
                        { site: "An application monitoring platform", issue: "No management interface." },
                        { site: "An audio streaming platform", issue: "Management interface does not display specific account information, only shows which IdP is bound." },
                        { site: "An e-commerce platform", issue: "Management interface does not display specific account information, only shows which IdP is bound." },
                        { site: "A writing assistance platform", issue: "No management interface or opaque IdP display." },
                        { site: "A financial data platform", issue: "No management interface or opaque IdP display." },
                        { site: "A news publication", issue: "No management interface or opaque IdP display." },
                        { site: "An e-commerce marketplace", issue: "No management interface or opaque IdP display." },
                        { site: "A stock photo platform", issue: "No management interface or opaque IdP display." },
                        { site: "A language learning platform", issue: "No management interface or opaque IdP display." },
                        { site: "An internet speed testing service", issue: "No management interface or opaque IdP display." },
                        { site: "A technology news website", issue: "No management interface or opaque IdP display." },
                        { site: "A digital library platform", issue: "No management interface or opaque IdP display." }
                    ],
                    cwe: [],
                    standards: [
                        { text: "OWASP ASVS V4.0 (Session Management)", url: "https://github.com/OWASP/ASVS/blob/master/4.0/en/0x12-V3-Session-management.md" }
                    ],
                    attacks: ["T6"]
                }
            };

            const greek = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ','φ','χ','ψ','ω'];
            const redactWebsiteLike = (s) => {
                if (!s) return '';
                return String(s)
                    .replace(/\b[a-z0-9-]+(\.[a-z0-9-]+)+\b/gi, '[redacted]')
                    .replace(/\bhttps?:\/\/\S+/gi, '[redacted]');
            };
            // For CASES: keep English readable; only redact URLs/domains if accidentally provided.
            const redactCaseDesc = (s) => redactWebsiteLike(s);
            const createLink = (text, url) => {
                const a = document.createElement('a');
                a.href = url;
                a.textContent = text;
                a.target = '_blank';
                a.style.color = '#3b82f6';
                a.style.textDecoration = 'none';
                a.onmouseover = () => a.style.textDecoration = 'underline';
                a.onmouseout = () => a.style.textDecoration = 'none';
                return a;
            };

            const setList = (el, items) => {
                if (!el) return 0;
                el.innerHTML = '';
                
                if (!items || items.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = 'None';
                    li.style.color = '#94a3b8'; 
                    li.style.fontStyle = 'italic';
                    li.style.listStyle = 'none'; 
                    li.style.marginLeft = '-18px'; 
                    el.appendChild(li);
                    return 1; 
                }
                
                (items || []).forEach((item) => {
                    const li = document.createElement('li');
                    // Check if item is an object with text and url (for standards links)
                    if (typeof item === 'object' && item.text && item.url) {
                        li.appendChild(createLink(item.text, item.url));
                    } else {
                        // Regular text (like CWE)
                        li.textContent = item;
                    }
                    el.appendChild(li);
                });
                return items.length;
            };
            
            const setAttackList = (el, attacks) => {
                if (!el) return 0;
                el.innerHTML = '';
                
                if (!attacks || attacks.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = 'None';
                    li.style.color = '#94a3b8'; 
                    li.style.fontStyle = 'italic';
                    li.style.listStyle = 'none'; 
                    li.style.marginLeft = '-18px'; 
                    el.appendChild(li);
                    return 1; 
                }
                
                (attacks || []).forEach((attack) => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `video.html#${attack}`;
                    link.textContent = attack;
                    link.target = '_blank';
                    link.style.color = '#3b82f6';
                    link.style.textDecoration = 'none';
                    link.onmouseover = () => link.style.textDecoration = 'underline';
                    link.onmouseout = () => link.style.textDecoration = 'none';
                    li.appendChild(link);
                    el.appendChild(li);
                });
                return attacks.length;
            };
            const setCases = (el, cases) => {
                if (!el) return 0;
                el.innerHTML = '';
                
                if (!cases || cases.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.textContent = 'None';
                    emptyDiv.style.color = '#94a3b8';
                    emptyDiv.style.fontStyle = 'italic';
                    emptyDiv.style.paddingLeft = '4px';
                    el.appendChild(emptyDiv);
                    return 1;
                }

                // Remove duplicates based on site description
                const seen = new Set();
                const uniqueCases = cases.filter((c) => {
                    const site = redactCaseDesc(c?.site || '');
                    if (seen.has(site)) {
                        return false;
                    }
                    seen.add(site);
                    return true;
                });

                // Create Table Wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'cases-wrapper';

                const table = document.createElement('table');
                table.className = 'cases-table';

                // Header
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `
                    <th class="col-id">#</th>
                    <th class="col-site">Site Description</th>
                `;
                thead.appendChild(headerRow);
                table.appendChild(thead);

                // Body
                const tbody = document.createElement('tbody');
                uniqueCases.forEach((c, idx) => {
                    const tr = document.createElement('tr');
                    const label = greek[idx] || String(idx + 1);
                    const site = redactCaseDesc(c?.site || '');

                    tr.innerHTML = `
                        <td class="col-id" style="text-align:center;">${label}</td>
                        <td class="col-site">${site}</td>
                    `;
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);

                wrapper.appendChild(table);
                el.appendChild(wrapper);
                return uniqueCases.length;
        };

        function showDetail(key) {
            const data = steps[key];
            if(!data) return;

            const content = document.getElementById('detail-content');
            const empty = document.getElementById('empty-state');
            const sidebarPane = document.getElementById('sidebar-pane');

            document.getElementById('d-tag').innerText = data.tag;
            document.getElementById('d-title').innerText = data.title;
            document.getElementById('d-desc').innerText = data.desc;

            // Sections (CASES / CWE / STANDARDS / ATTACKS)
            const sections = document.getElementById('d-sections');
            
            // Always show sections now, just populate "None" if empty
            setCases(document.getElementById('d-cases'), data.cases);
            setList(document.getElementById('d-cwe'), data.cwe);
            setList(document.getElementById('d-std'), data.standards);
            setAttackList(document.getElementById('d-attacks'), data.attacks || []);
            
            if (sections) sections.style.display = 'block';

            empty.style.display = 'none';
            content.style.display = 'block';
            sidebarPane.classList.remove('is-collapsed');

            content.classList.remove('slide-in');
            void content.offsetWidth;
            content.classList.add('slide-in');
        }

        // Ensure everyone (including refresh/back-forward cache) sees the empty state first.
        function resetUI() {
            const content = document.getElementById('detail-content');
            const empty = document.getElementById('empty-state');
            const sidebarPane = document.getElementById('sidebar-pane');
            if (!content || !empty || !sidebarPane) return;

            content.style.display = 'none';
            empty.style.display = 'flex';
            sidebarPane.classList.add('is-collapsed');
        }

        window.addEventListener('DOMContentLoaded', resetUI);
        window.addEventListener('pageshow', (e) => {
            // When restored from bfcache, DOM isn't reloaded; force reset.
            if (e.persisted) resetUI();
        });

        // Zoom and drag flowchart
        const svgWrapper = document.getElementById('svg-wrapper');
        const zoomRange = document.getElementById('zoom-range');
        const zoomValue = document.getElementById('zoom-value');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const canvasPane = document.querySelector('.canvas-pane');

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        const clampZoom = (v) => Math.min(2.0, Math.max(0.7, v));
        const applyTransform = () => {
            svgWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            zoomRange.value = zoomLevel.toFixed(2);
            zoomValue.textContent = `${Math.round(zoomLevel * 100)}%`;
        };

        const applyZoom = (v) => {
            zoomLevel = clampZoom(v);
            applyTransform();
        };

        // Zoom Control
        zoomRange.addEventListener('input', (e) => applyZoom(parseFloat(e.target.value)));
        zoomInBtn.addEventListener('click', () => applyZoom(zoomLevel + 0.1));
        zoomOutBtn.addEventListener('click', () => applyZoom(zoomLevel - 0.1));
        canvasPane.addEventListener('wheel', (e) => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            applyZoom(zoomLevel + (e.deltaY < 0 ? 0.05 : -0.05));
        }, { passive: false });

        // Drag Control
        canvasPane.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            canvasPane.style.cursor = 'grabbing';
        });

        canvasPane.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            applyTransform();
        });

        canvasPane.addEventListener('mouseup', () => {
            isDragging = false;
            canvasPane.style.cursor = 'grab';
        });

        canvasPane.addEventListener('mouseleave', () => {
            isDragging = false;
            canvasPane.style.cursor = 'grab';
        });

        // Set initial cursor style
        canvasPane.style.cursor = 'grab';

        applyTransform();
    </script>
</body>
